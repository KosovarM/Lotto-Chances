[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotto-analyzer"
version = "0.2.0"
description = "Lotto 6aus49 historical statistics (learning project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Receipt photo reading (local OCR, no cloud service)
ocr = ["rapidocr>=3.0", "onnxruntime>=1.18", "pillow>=10.0", "numpy>=1.26"]

[project.scripts]
lotto = "lotto.cli:main"
lotto-web = "lotto.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
